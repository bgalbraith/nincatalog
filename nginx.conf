# nincatalog.com
#
# Install to /etc/nginx/sites-available/nincatalog.com and symlink into
# sites-enabled, alongside the existing nin.fan config.

server {
    listen 80;
    listen [::]:80;
    server_name nincatalog.com www.nincatalog.com merch.nincatalog.com admin.nincatalog.com;
    return 301 https://$host$request_uri;
}

# www is canonicalised to the apex, matching the legacy host. The legacy config
# only did this on port 80, leaving https://www.nincatalog.com with no server
# block at all; this closes that gap.
server {
    listen 443 ssl;
    http2 on;
    server_name www.nincatalog.com;

    ssl_certificate     /etc/letsencrypt/live/nincatalog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nincatalog.com/privkey.pem;

    return 301 https://nincatalog.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # django-hosts routes on the Host header, so one block serves all three.
    # The apex matches no host pattern and falls through to DEFAULT_HOST=www.
    server_name nincatalog.com merch.nincatalog.com admin.nincatalog.com;

    ssl_certificate     /etc/letsencrypt/live/nincatalog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nincatalog.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Legacy was 5M, against media files already reaching 3.8M.
    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Content-hashed filenames, so immutable is safe.
    location /static/ {
        alias /var/www/nincatalog/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # NOT immutable: media filenames are stable across replacement, so a new
    # product photo reuses its path and must be able to invalidate.
    location /media/ {
        alias /srv/nincatalog/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/run/nincatalog/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Load-bearing: gunicorn derives wsgi.url_scheme from this header over a
        # unix socket, which is what makes request.is_secure() true and admin
        # CSRF pass. Removing it silently breaks admin form submission.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
