[project]
name = "nincatalog"
version = "0.1.0"
description = "Catalog of Nine Inch Nails releases and collectibles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "django-clone>=5.5.0",
    "django-environ>=0.12.0",
    "django-hosts>=7.0",
    "django-imagekit>=6.1.0",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=23.0.0",
    "markdown2>=2.5.0",
    "pillow>=11",
    "PyYAML>=6.0",
]
